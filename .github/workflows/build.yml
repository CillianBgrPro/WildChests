name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build
        run: >
          ./gradlew build --no-daemon --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-download=false

      - uses: actions/upload-artifact@v4
        with:
          name: WildChests
          path: target/WildChests-*.jar
          if-no-files-found: error

      # Also store the jar in the `builds` branch so it can be fetched with git.
      - name: Publish jar to builds branch
        if: github.ref_name != 'builds'
        run: |
          mkdir /tmp/out && cp target/WildChests-*.jar /tmp/out/
          cd /tmp/out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds

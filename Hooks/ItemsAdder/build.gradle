group 'Hooks:ItemsAdder'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

repositories {
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    // ItemsAdder is accessed through reflection, no compile dependency needed.
    compileOnly "io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT"
    compileOnly project(":API")
    compileOnly project(":")
}

if (project.hasProperty('hook.compile_itemsadder') &&
        !Boolean.valueOf(project.findProperty("hook.compile_itemsadder").toString())) {
    project.tasks.all { task -> task.enabled = false }
}
